<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PitForge</title>
  </head>
  <body>
    <aside id="panel">
      <h1>PitForge</h1>
      <p class="tagline">Open-pit block model viewer</p>

      <section>
        <h2>Model</h2>
        <label class="button">
          Load CSV
          <input id="file-input" type="file" accept=".csv,.txt" hidden />
        </label>
        <button id="sample-button" type="button">Sample model</button>
        <p id="status" role="status"></p>
      </section>

      <section>
        <h2>Cutoff grade</h2>
        <input id="cutoff" type="range" />
        <p><span id="cutoff-value"></span></p>
      </section>

      <section>
        <h2 id="legend-title">Grade</h2>
        <div id="legend-bar"></div>
        <div class="legend-range">
          <span id="legend-min"></span>
          <span id="legend-max"></span>
        </div>
      </section>

      <section>
        <h2>Summary</h2>
        <dl id="stats"></dl>
      </section>

      <section>
        <h2>Pit design</h2>
        <label class="check"><input id="pit-enabled" type="checkbox" checked /> Enable pit</label>
        <label class="field">
          <span class="field-head"><span>Show blocks</span></span>
          <select id="block-mode">
            <option value="remaining">Remaining after mining</option>
            <option value="mined">Inside pit</option>
            <option value="all">All</option>
          </select>
        </label>
        <div id="pit-controls"></div>
        <label class="check"><input id="ramp-enabled" type="checkbox" checked /> Haul ramp</label>
        <div id="ramp-controls"></div>
        <label class="check"><input id="ramp-clockwise" type="checkbox" /> Climbs clockwise</label>
        <p id="pit-slope"></p>
      </section>

      <section>
        <h2>Pit optimisation</h2>
        <div id="economic-controls"></div>
        <p id="break-even" class="note"></p>
        <button id="optimise-button" type="button">Run optimisation</button>
        <p id="optimise-status" class="note" role="status"></p>
        <dl id="optimise-results"></dl>
      </section>

      <section>
        <h2>Scheduling</h2>
        <label class="check"><input id="schedule-enabled" type="checkbox" /> Schedule the pit</label>
        <div id="schedule-controls"></div>
        <label class="check"><input id="colour-by-period" type="checkbox" /> Colour blocks by period</label>
        <p id="schedule-summary" class="note"></p>
      </section>

      <section>
        <h2>Pit reserves</h2>
        <label class="field">
          <span class="field-head"><span>Pit</span></span>
          <select id="pit-source">
            <option value="design">Manual design</option>
            <option value="optimised">Optimised shell</option>
          </select>
        </label>
        <div id="reserve-controls"></div>
        <dl id="reserves"></dl>
      </section>

      <p class="hint">Drag to orbit · right-drag to pan · scroll to zoom</p>
    </aside>
    <div id="workspace">
      <main id="viewport"></main>
      <div id="schedule-panel" hidden>
        <div id="playback">
          <button id="play-button" type="button">Play</button>
          <input id="period-slider" type="range" min="0" step="1" aria-label="Period shown" />
          <span id="period-label"></span>
        </div>
        <div id="schedule-scroll">
          <table id="schedule-table"></table>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
